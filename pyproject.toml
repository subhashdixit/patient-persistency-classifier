[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"
[project]
name = "patient-persistency-classifier"
version = "1.0.0"
description = "Baseline-only patient persistency learning application"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
persistency = ["templates/*.html", "static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.black]
line-length = 88
[tool.pylint.main]
source-roots = ["src"]
[tool.pylint.messages_control]
disable = ["too-few-public-methods", "too-many-locals", "too-many-statements", "too-many-arguments", "too-many-positional-arguments", "duplicate-code", "import-outside-toplevel"]
[tool.pylint.format]
max-line-length = 88
